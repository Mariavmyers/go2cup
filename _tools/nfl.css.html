<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --pitch:#07180e; --turf:#0a2413; --line:#15381f; --card:#11281a; --card2:#163122;
  --text:#e8f2ec; --muted:#8fb3a0; --blue:#2f80ff; --green:#21c25a; --red:#ff4338; --gold:#f5c518;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pitch);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

header{border-bottom:1px solid var(--line);background:var(--turf)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1}
.logo .b{color:var(--blue)}.logo .w{color:#fff}.logo .r{color:var(--red)}
.menu{display:flex;gap:18px;flex-wrap:wrap;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.menu a{color:#9fb8aa}.menu a.active,.menu a:hover{color:var(--gold)}

/* HERO: the yard-line field — the one bold element */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.06) calc(10% - 1px) 10%),
    linear-gradient(180deg,#0d2c18,#07180e)}
.hero .wrap{padding-top:40px;padding-bottom:30px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,9vw,96px);line-height:.9;letter-spacing:1px}
.hero .lede{color:var(--muted);max-width:620px;margin-top:10px;font-size:15.5px}
.feature{margin-top:26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;max-width:720px;
  background:rgba(7,24,14,.75);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.feature .side{display:flex;align-items:center;gap:12px;min-width:0}
.feature .side.r{flex-direction:row-reverse;text-align:right}
.feature .tm{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;line-height:1.15}
.feature .tm small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
.feature .score{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:1;letter-spacing:2px;white-space:nowrap}
.feature .score .lose{color:#6f8f7e}
.feature .cap{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:center}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--text);letter-spacing:1px;line-height:1}

/* team badge: a neutral text label (no league or club logos, no team colorways).
   Border color marks the conference using the site's own brand colors. */
.badge{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
  font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;color:#fff;
  border:2px solid var(--c);background:#0d2216}
.badge.sm{width:32px;height:32px;font-size:14px;border-radius:7px;border-width:2px}
.badge.lg{width:58px;height:58px;font-size:24px;border-radius:12px;border-width:3px}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:rgba(7,24,14,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{display:inline-block;background:none;border:0;color:#9fb8aa;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.6px;text-transform:uppercase;
  padding:14px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:26px 0 50px}
.panel[hidden]{display:none}
h2{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px;max-width:640px}

/* week picker */
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.wk{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;
  font-family:'Oswald',sans-serif;font-size:14px;cursor:pointer}
.wk:hover{border-color:#2d6a44}
.wk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#07180e}
.wk.up{color:var(--muted)}
.wk.up[aria-pressed="true"]{color:#07180e}
.daylbl{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.6px;color:var(--gold);margin:20px 0 10px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px}

.game{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px}
.wkh{font-family:'Oswald',sans-serif;font-size:20px;margin:26px 0 0}
.js .wkh{position:absolute;left:-9999px}
.vh{position:absolute;left:-9999px}
.trow{display:flex;align-items:center;gap:10px;margin:4px 0}
.trow .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.trow .pts{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;min-width:38px;text-align:right}
.trow.lost .nm,.trow.lost .pts{color:#6f8f7e}
.gmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px;padding-top:7px}
.tag{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.4px;border-radius:5px;padding:1px 6px;border:1px solid}
.tag.ot{color:var(--gold);border-color:#5a4406}
.tag.intl{color:#7fb6ff;border-color:#1d3f73}
.tag.tie{color:#ff9a90;border-color:#6b2420}

/* standings */
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));gap:18px}
.div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto}
@media (max-width:600px){.leader td:first-child .tcell::after{display:none}td,th{padding-left:4px;padding-right:4px}}
.div h4{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:4px 6px}
th:first-child{text-align:left}
td{white-space:nowrap;padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child{text-align:left}
.tcell{display:flex;align-items:center;gap:9px;font-weight:600}
.leader td:first-child .tcell::after{content:"Leads";font-family:'Oswald',sans-serif;font-weight:500;font-size:11px;color:var(--gold);border:1px solid #5a4406;border-radius:4px;padding:0 5px}
.streak.W{color:var(--green)}.streak.L{color:var(--red)}

/* teams */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;font-size:14px}
.filters input{flex:1 1 220px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.team .top{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.team .top h4{font-family:'Oswald',sans-serif;font-size:17px;line-height:1.15}
.team .top p{font-size:12.5px;color:var(--muted)}
.team .body{padding:12px 14px;font-size:13.5px;flex:1}
.team .body dt{color:var(--muted);font-size:12px}
.team .body dd{margin-bottom:6px}
.team .rec{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;line-height:1}
.team .links{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.btn{display:inline-block;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.4px;border-radius:7px;padding:7px 11px;border:1px solid #2d6a44;color:#cfe8da}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.solid{background:var(--green);border-color:var(--green);color:#04150b;font-weight:600}
.btn.solid:hover{background:#2ad868;color:#04150b}

/* news */
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:14px}
.story{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.story h3{font-family:'Oswald',sans-serif;font-size:19px;line-height:1.25;margin-bottom:6px}
.story p{font-size:14px;color:#c6dccf}
.story .when{font-size:12px;color:var(--muted);margin-bottom:6px}
.story ul{margin:6px 0 0 18px;font-size:14px;color:#c6dccf}

/* store */
.store{background:linear-gradient(135deg,#123a1f,#07180e 60%);border:1px solid #2d6a44;border-radius:16px;padding:30px 24px;text-align:center}
.store h2{font-size:42px}
.store p{color:#c6dccf;max-width:560px;margin:8px auto 18px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin-top:22px;text-align:left}
.slot{border:1px dashed #2d6a44;border-radius:12px;padding:16px;color:var(--muted);font-size:13.5px}
.slot b{display:block;color:var(--text);font-family:'Oswald',sans-serif;font-size:16px;margin-bottom:4px}

.note{font-size:12.5px;color:var(--muted);margin-top:22px}
footer{border-top:1px solid var(--line);background:var(--turf);padding:22px 0;font-size:12.5px;color:var(--muted);line-height:1.7}
footer a{color:#cfe8da;text-decoration:underline}
.loading{color:var(--muted);padding:30px 0}

@media (max-width:600px){
  .hero h1{font-size:52px}
  .stats{gap:18px}
  .stats b{font-size:28px}
  .feature{grid-template-columns:1fr;text-align:center}
  .feature .side,.feature .side.r{justify-content:center;flex-direction:row;text-align:left}
  .feature .score{text-align:center}
  .hero .wrap{padding-top:28px}
}
@media (prefers-reduced-motion:no-preference){
  .js .panel:not([hidden]){animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
